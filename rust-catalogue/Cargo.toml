[package]
name = "tart-catalogue-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Browser-side satellite horizontal (az/el/range) computation for the TART catalogue"
repository = "https://github.com/tart-telescope/web_app"

# Mirrors rust/Cargo.toml: cdylib for wasm-pack, rlib for native linking.
[lib]
name = "tart_catalogue_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# TLE propagation, geodesy and sidereal time. The maths, none of it ours.
# <https://github.com/tart-telescope/catalogue>
tart-catalogue-core = "0.1"

# JSON at the wasm boundary: TLE records in, look-angle rows out.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2.128", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
